'<section class="section scroll-watch"><div class="section-heading"><div><h2>Mais para você</h2><p>Escolhas especiais para completar seu pedido.</p></div><button class="inline-link" data-route="menu">Cardápio completo '+ic("chevronRight",14)+'</button></div><div class="food-grid">'+["CK-044","CK-040","CK-025","CK-088"].map(id=>get(id)).filter(Boolean).map(productCard).join("")+'</div></section><p class="footer-note">Fotos originais do cardápio e preços de referência, ainda não confirmados pelo restaurante.</p>'}
function matching(){let a=d.filter(p=>(state.category==="Todos"||p.cat===state.category)&&(p.name+" "+p.desc+" "+p.cat).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(state.query.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()));if(state.sort==="low")a.sort((x,y)=>x.price-y.price);else if(state.sort==="high")a.sort((x,y)=>y.price-x.price);else if(state.sort==="az")a.sort((x,y)=>x.name.localeCompare(y.name));else a.sort((x,y)=>Number(y.featured)-Number(x.featured));return a}
function menuPage(){return '<div class="page-heading"><button class="back-link" data-route="home">'+ic("arrow",12).replace('M4 12h16M13 5l7 7-7 7','M20 12H4m7 7-7-7 7-7')+' Voltar</button><h1>Cardápio<span style="color:var(--red)">.</span></h1><p>Encontre seus favoritos sem complicação.</p></div>'+
'<div class="search-row"><label class="search">'+ic("search",16)+'<input id="search-input" type="search" aria-label="Buscar produtos" placeholder="Buscar pratos e ingredientes..." value="'+esc(state.query)+'"></label></div>'+categoryFilters()+
'<div class="toolbar"><small id="count-label"></small><div class="toolbar-right"><select class="sort-select" id="sort-input" aria-label="Ordenar produtos"><option value="featured" '+(state.sort==="featured"?"selected":"")+'>Destaques</option><option value="low" '+(state.sort==="low"?"selected":"")+'>Menor preço</option><option value="high" '+(state.sort==="high"?"selected":"")+'>Maior preço</option><option value="az" '+(state.sort==="az"?"selected":"")+'>A–Z</option></select><div class="view-switch"><button data-view="list" aria-label="Visualização em lista" class="'+(state.view==="list"?"on":"")+'">'+ic("list",15)+'</button><button data-view="grid" aria-label="Visualização em grade" class="'+(state.view==="grid"?"on":"")+'">'+ic("grid",14)+'</button></div></div></div>'+
'<section id="menu-results"></section><div class="footer-note">Fotos originais do cardápio e preços de referência, sujeitos à confirmação pela CK Sushi.</div>'}
function drawResults(){const el=document.getElementById("menu-results");if(!el)return;const result=matching();document.getElementById("count-label").textContent=result.length+" produtos";el.innerHTML=result.length?'<div class="food-grid menu-grid '+state.view+'">'+result.map(productCard).join("")+'</div>':'<div class="empty">'+ic("search",22)+'<h3>Nenhum resultado</h3><p>Tente outra busca ou categoria.</p><button class="btn btn-quiet" data-clear>Limpar filtros</button></div>'}
function favoritesPage(){const items=state.favorites.map(get).filter(Boolean);return '<div class="page-heading"><button class="back-link" data-route="home">← Início</button><h1>Seus favoritos<span style="color:var(--red)">.</span></h1><p>Guarde os pratos que você mais gosta.</p></div>'+(items.length?'<div class="food-grid">'+items.map(productCard).join("")+'</div>':'<div class="empty"><div style="display:grid;place-items:center;color:#b51f30">'+ic("heart",25)+'</div><h3>Seu cantinho favorito</h3><p>Toque no coração dos produtos para encontrá-los aqui.</p><button class="btn btn-primary" data-route="menu">Explorar cardápio</button></div>')}
function basicStep(label,value){return '<div class="summary-row"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function stepper(id,n){return '<div class="stepper"><button aria-label="Diminuir quantidade" data-change="'+id+'" data-delta="-1">'+ic("minus",13)+'</button><span>'+n+'</span><button aria-label="Aumentar quantidade" data-change="'+id+'" data-delta="1">'+ic("plus",13)+'</button></div>'}
function drawer(){const entries=Object.entries(state.cart).filter(([id,q])=>get(id)&&q>0);return '<div class="overlay-shade" data-close></div><aside class="cart-drawer" role="dialog" aria-modal="true" aria-label="Seu carrinho"><div class="drawer-head"><div><h2>Seu carrinho</h2><small>'+quantity()+' '+(quantity()===1?"produto":"produtos")+' selecionados</small></div><button class="close-circle" data-close aria-label="Fechar carrinho">'+ic("close",16)+'</button></div>'+
'<div class="drawer-list">'+(entries.length?entries.map(([id,q])=>{const p=get(id);return '<div class="cart-line"><img src="'+p.photo+'" alt="Foto ilustrativa"><div class="cart-line-main"><div class="cart-line-name">'+esc(p.name)+'</div><p class="cart-line-note">'+esc(p.desc)+(state.notes[id]?"<br>Obs.: "+esc(state.notes[id]):"")+'</p><div class="cart-line-bottom"><strong>'+money(p.price*q)+'</strong>'+stepper(id,q)+'</div></div></div>'}).join(""):'<div class="empty" style="margin:20px 0"><h3>Seu carrinho está vazio</h3><p>Seu próximo favorito está a poucos toques.</p><button class="btn btn-quiet" data-route="menu">Ver cardápio</button></div>')+'</div>'+
'<div class="drawer-summary">'+basicStep("Subtotal",money(subtotal()))+basicStep("Entrega","Calculada na finalização")+'<div class="summary-row summary-total"><span>Subtotal</span><strong>'+money(subtotal())+'</strong></div>'+(subtotal()>0&&subtotal()<29.9?'<div class="quiet-block">Faltam '+money(29.9-subtotal())+' para atingir o pedido mínimo anunciado.</div>':"")+'<button class="btn btn-primary btn-full" data-checkout '+(subtotal()<29.9?"disabled":"")+'>Continuar '+ic("arrow",16)+'</button><p class="quiet-block">Nenhum pedido ou pagamento real será enviado nesta demonstração.</p></div></aside>'}
function detail(p){const note=state.notes[p.id]||"",old=p.oldPrice&&p.oldPrice>p.price?'<span class="detail-old">'+money(p.oldPrice)+'</span>':'';return '<div class="overlay-shade" data-close></div><section class="detail-sheet" role="dialog" aria-modal="true" aria-label="Detalhes do produto"><div class="detail-cover '+(p.cat==="Bebidas"?"drink-photo":"")+'"><img class="detail-image" src="'+esc(p.photo)+'" data-fallback="'+esc(p.thumb||p.photo)+'" alt="Foto do produto '+esc(p.name)+'"></div><div class="detail-content"><div class="detail-top"><span>'+esc(p.cat)+(p.tag?' · '+esc(p.tag):'')+'</span><button class="close-circle" data-close aria-label="Fechar detalhes">'+ic("close",15)+'</button></div><h2>'+esc(p.name)+'</h2><div class="detail-price">'+old+money(p.price)+'</div>'+(p.desc?'<p class="detail-description">'+esc(p.desc)+'</p>':'')+(p.needsReview?'<p class="product-caveat">Composição resumida no cardápio original. Confirme os detalhes com a CK Sushi.</p>':'')+'<label class="detail-label" for="item-note">Alguma observação? <span style="font-weight:500;color:#8f8580">(opcional)</span></label><textarea class="detail-notes" id="item-note" maxlength="180" placeholder="Ex.: sem cebolinha">'+esc(note)+'</textarea><div class="detail-foot">'+stepper("modal",state.qty)+'<button class="btn btn-primary" data-detail-add>Adicionar · '+money(p.price*state.qty)+' '+ic("arrow",14)+'</button></div></div></section>'}

function field(id,label,placeholder,required,type){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" name="'+id+'" type="'+(type||"text")+'" placeholder="'+placeholder+'" '+(required?"required":"")+' autocomplete="off" value="'+esc(state.checkoutFields[id]||"")+'"></div>'}
function checkoutPage(){if(!quantity())return '<div class="empty" style="margin:55px auto;max-width:520px"><h3>Seu carrinho está vazio</h3><p>Adicione produtos para experimentar o checkout.</p><button class="btn btn-primary" data-route="menu">Ir ao cardápio</button></div>';const fee=state.fulfillment==="delivery"?11:0;return '<div class="page-heading"><button class="back-link" data-cart>← Voltar ao carrinho</button><h1>Finalizar pedido<span style="color:var(--red)">.</span></h1><p>Revise os detalhes da sua simulação.</p></div><div class="progress"><span class="active">01 Carrinho</span><i></i><span class="active">02 Entrega e pagamento</span><i></i><span>03 Confirmação</span></div><div class="checkout-grid"><form id="checkout-form" class="form-stack"><div class="panel"><h3>Como você quer receber?</h3><div class="mode-row"><button type="button" class="mode-opt '+(state.fulfillment==="delivery"?"active":"")+'" data-mode="delivery">Entrega</button><button type="button" class="mode-opt '+(state.fulfillment==="pickup"?"active":"")+'" data-mode="pickup">Retirada</button></div><p class="quiet" style="margin-top:10px">Sem cálculo de frete por localização nesta versão.</p></div><div class="panel"><h3>Seus dados</h3><div class="field-grid">'+field("customer","Nome","Seu nome",true)+field("phone","Celular","(11) 99999-9999",true,"tel")+'</div>'+(state.fulfillment==="delivery"?'<div class="field-grid" style="margin-top:10px">'+field("cep","CEP","00000-000",false)+field("district","Bairro","Seu bairro",true)+'</div><div class="field-grid" style="margin-top:10px">'+field("street","Rua","Nome da rua",true)+field("number","Número","Nº",true)+'</div><div style="margin-top:10px">'+field("detail","Complemento (opcional)","Apartamento, bloco, referência",false)+'</div>':'<p class="quiet" style="margin-top:10px">O endereço de retirada deverá ser confirmado com a CK Sushi.</p>')+'</div><div class="panel"><h3>Forma de pagamento</h3><div class="pay-row">'+["Pix","Cartão","Dinheiro"].map(m=>'<button type="button" class="pay-choice '+(state.pay===m?"active":"")+'" data-pay="'+m+'">'+m+'</button>').join("")+'</div><p class="quiet-block">Esta escolha é apenas visual. Nenhuma chave Pix ou cobrança será criada.</p></div><button type="submit" class="btn btn-primary btn-full">Concluir simulação '+ic("arrow",15)+'</button></form><aside class="panel"><h3>Resumo do pedido</h3>'+Object.entries(state.cart).filter(([id,q])=>get(id)&&q>0).map(([id,q])=>basicStep(q+" × "+esc(get(id).name),money(q*get(id).price))).join("")+'<div style="border-top:1px solid #ede6e2;margin-top:14px;padding-top:4px">'+basicStep("Produtos",money(subtotal()))+basicStep("Frete ilustrativo",money(fee))+'</div><div class="summary-row summary-total"><span>Total simulado</span><strong>'+money(subtotal()+fee)+'</strong></div><p class="quiet-block">A loja deverá confirmar preços, região, frete e disponibilidade antes de operar de verdade.</p></aside></div>'}

function deliveryMap(order){if(order.fulfillment!=="delivery")return "";const url=typeof order.ifoodTrackingUrl==="string"&&/^https:\/\/meupedido\.ifood\.com\.br\//i.test(order.ifoodTrackingUrl)?order.ifoodTrackingUrl:null;return '<section class="ifood-delivery-card scroll-watch" aria-label="Acompanhamento de entrega pelo iFood"><div class="ifood-delivery-mark">'+ic("truck",22)+'</div><div><span class="eyebrow">Entrega parceira</span><h3>Acompanhe pelo iFood</h3><p>Quando a CK Sushi solicitar o entregador, o rastreamento oficial poderá ser disponibilizado aqui. Esta página ainda é uma demonstração.</p>'+(url?'<a class="btn btn-primary" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Abrir rastreamento oficial '+ic("arrow",15)+'</a>':'<span class="tracking-pending">Link de rastreamento ainda não disponível</span>')+'</div></section>'}

const stages=["Pedido registrado","Em preparação","Aguardando retirada","Saiu para entrega","Entregue"];
function ordersPage(){const o=state.order;if(!o)return '<div class="page-heading"><h1>Meus pedidos<span style="color:var(--red)">.</span></h1><p>Veja como funcionará o acompanhamento.</p></div><div class="empty"><div style="display:grid;place-items:center">'+ic("receipt",24)+'</div><h3>Nenhum pedido de demonstração</h3><p>Simule uma compra e veja como funcionará o acompanhamento pelo iFood.</p><button class="btn btn-primary" data-route="menu">Explorar cardápio</button></div>';const list=o.fulfillment==="pickup"?["Pedido registrado","Em preparação","Pronto para retirada","Retirado"]:stages;return '<div class="track-shell"><div class="track-top"><div class="track-mark">'+ic("check",24)+'</div><span class="eyebrow">Pedido de demonstração</span><h1>Acompanhe cada etapa.</h1><p>'+esc(o.id)+' • não representa entrega ou pagamento real</p></div>'+deliveryMap(o)+'<div class="panel"><h3>Andamento do pedido</h3><div class="timeline">'+list.map((stage,i)=>'<div class="timeline-step '+(i<o.stage?"done":i===o.stage?"current":"")+'"><div class="node">'+(i<o.stage?ic("check",13):i+1)+'</div><div><h4>'+stage+'</h4><p>'+(i<o.stage?"Etapa fictícia concluída":i===o.stage?"Etapa atual da simulação":"Aguardando simulação")+'</p></div></div>').join("")+'</div>'+(o.stage<list.length-1?'<button class="btn btn-quiet btn-full" data-advance style="margin-top:17px">Avançar etapa fictícia '+ic("arrow",14)+'</button>':'<p class="quiet-block">Simulação concluída.</p>')+'</div><div class="panel" style="margin-top:15px"><h3>Resumo</h3>'+basicStep("Itens",o.quantity)+basicStep("Pagamento selecionado",esc(o.pay))+basicStep("Total demonstrativo",money(o.total))+'<button class="btn btn-quiet btn-full" style="margin-top:18px" data-route="menu">Voltar ao cardápio</button></div></div>'}

function page(){if(state.route==="menu")return menuPage();if(state.route==="favorites")return favoritesPage();if(state.route==="orders")return ordersPage();if(state.route==="checkout")return checkoutPage();return homePage()}
let fadeObserver=null;
function initScrollReveal(){if(fadeObserver)fadeObserver.disconnect();const elements=app.querySelectorAll(".scroll-watch");if(!elements.length)return;if(!("IntersectionObserver" in window)||window.matchMedia("(prefers-reduced-motion: reduce)").matches){elements.forEach(el=>el.classList.add("seen"));return}document.body.classList.add("motion-ready");fadeObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("seen");fadeObserver.unobserve(entry.target)}}),{threshold:.06,rootMargin:"0px 0px 35px 0px"});elements.forEach(el=>fadeObserver.observe(el))}
function render(){app.innerHTML=page();if(state.route==="menu")drawResults();sync();initScrollReveal()}
function sync(){let c=quantity(),b=document.getElementById("cart-count"),f=document.getElementById("fav-count"),bar=document.getElementById("floating-cart");b.hidden=c===0;b.textContent=c;f.hidden=state.favorites.length===0;f.textContent=state.favorites.length;bar.hidden=!c||!["home","menu","favorites"].includes(state.route);document.getElementById("floating-cart-count").textContent=c+" "+(c===1?"item":"itens")+" no carrinho";document.getElementById("floating-cart-total").textContent=money(subtotal());const mobileBadge=document.getElementById("mobile-cart-count");if(mobileBadge){mobileBadge.hidden=c===0;mobileBadge.textContent=c>9?"9+":c}const location=document.querySelector(".header-inline-location"),title=document.getElementById("header-location-title"),label=document.querySelector(".header-location-label");if(location&&title&&label){const delivering=state.fulfillment==="delivery";title.textContent=delivering?deliverySummary():"Selecionar entrega";label.textContent=delivering?"Entregar em":"Retirada na loja";location.setAttribute("aria-label",delivering?"Informar endereço de entrega":"Mudar para entrega");location.toggleAttribute("data-address-open",delivering);location.toggleAttribute("data-mode",!delivering);if(!delivering)location.dataset.mode="delivery";else delete location.dataset.mode;}document.querySelectorAll("[data-icon]").forEach(el=>el.innerHTML=ic(el.dataset.icon,19));document.querySelectorAll("[data-route]").forEach(el=>{if(el.closest("nav")){el.classList.toggle("on",el.dataset.route===state.route);el.classList.toggle("selected",el.dataset.route===state.route)}})}
function routeTo(next){closePanel();state.route=["home","menu","favorites","orders","checkout"].includes(next)?next:"home";if(location.hash.slice(1)!==state.route)history.pushState({}, "", "#"+state.route);render();window.scrollTo({top:0,behavior:"instant"})}
function openPanel(kind,id){state.panel=kind;state.productId=id||null;state.qty=1;overlay.classList.add("open");overlay.innerHTML=kind==="cart"?drawer():kind==="location"?locationPanel():detail(get(id));document.body.classList.add("no-scroll");overlay.querySelector("[data-close]")?.focus()}
function closePanel(){overlay.classList.remove("open");overlay.innerHTML="";document.body.classList.remove("no-scroll");state.panel=null;state.productId=null}
function updatePanel(){if(!state.panel)return;const active=document.activeElement;const target=active?.getAttribute("data-change")||"";const note=state.panel==="detail"?document.getElementById("item-note")?.value:null;overlay.innerHTML=state.panel==="cart"?drawer():detail(get(state.productId));if(note!==null){const field=document.getElementById("item-note");if(field)field.value=note}if(target)overlay.querySelector('[data-change="'+target+'"]')?.focus()}
function toast(message){const box=document.createElement("div");box.className="toast";box.innerHTML=ic("check",15)+"<span>"+esc(message)+"</span>";const host=document.getElementById("toast-zone");host.replaceChildren(box);setTimeout(()=>{box.style.opacity="0";box.style.transform="translateY(6px)";setTimeout(()=>box.remove(),200)},2400)}
function add(id,n){const p=get(id);if(!p)return;state.cart[id]=Math.min(99,(Number(state.cart[id])||0)+n);if(state.cart[id]<=0){delete state.cart[id];delete state.notes[id]}save();sync();if(state.panel==="cart")updatePanel();if(state.route==="checkout")render()}
function favorite(id){const index=state.favorites.indexOf(id);if(index===-1)state.favorites.push(id);else state.favorites.splice(index,1);save();if(state.route==="favorites")render();else document.querySelectorAll('[data-favorite="'+id+'"]').forEach(el=>{el.classList.toggle("active",isFavorite(id));el.setAttribute("aria-pressed",isFavorite(id))});sync()}
function processCheckout(form){if(!form.reportValidity())return;const fee=state.fulfillment==="delivery"?11:0;state.order={id:"#DEMO-"+String(Date.now()).slice(-6),quantity:quantity(),total:subtotal()+fee,pay:state.pay,fulfillment:state.fulfillment,stage:0};state.cart={};state.notes={};state.checkoutFields={};save();routeTo("orders");toast("Pedido de demonstração criado")}
document.addEventListener("click",e=>{
const arcStep=e.target.closest("[data-arc-step]");if(arcStep){updateArc(arcActive+Number(arcStep.dataset.arcStep));return}
const arcChoice=e.target.closest("[data-arc-select]");if(arcChoice){if(Date.now()<suppressWheelClickUntil)return;const i=Number(arcChoice.dataset.arcSelect);if(i===arcActive){state.category=arcNames[i];routeTo("menu")}else updateArc(i);return}
const arcGo=e.target.closest("[data-arc-open]");if(arcGo){state.category=arcNames[arcActive];routeTo("menu");return}
const heroDot=e.target.closest("[data-hero-index]");if(heroDot){showHero(Number(heroDot.dataset.heroIndex));return}
const heroGo=e.target.closest("[data-hero-open]");if(heroGo){if(Date.now()<suppressHeroClickUntil)return;state.category=heroSlides[heroActive].category;routeTo("menu");return}
const close=e.target.closest("[data-close]");if(close){closePanel();return}
const address=e.target.closest("[data-address-open]");if(address){openPanel("location");return}
const searchAct=e.target.closest("[data-focus-search]");if(searchAct){state.query="";routeTo("menu");document.getElementById("search-input")?.focus();return}
const route=e.target.closest("[data-route]");if(route){routeTo(route.dataset.route);return}
const cartBtn=e.target.closest("[data-cart]");if(cartBtn){openPanel("cart");return}
const prod=e.target.closest("[data-product]");if(prod){openPanel("detail",prod.dataset.product);return}
const fav=e.target.closest("[data-favorite]");if(fav){favorite(fav.dataset.favorite);return}
const plus=e.target.closest("[data-add]");if(plus){add(plus.dataset.add,1);toast("Adicionado ao carrinho");plus.style.animation="pop .28s ease";return}
const category=e.target.closest("[data-category]");if(category){state.category=category.dataset.category;routeTo("menu");return}
const view=e.target.closest("[data-view]");if(view){state.view=view.dataset.view;const holder=document.getElementById("menu-results");if(holder){drawResults();document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===state.view))}return}
const clear=e.target.closest("[data-clear]");if(clear){state.query="";state.category="Todos";render();return}
const change=e.target.closest("[data-change]");if(change){let delta=Number(change.dataset.delta);if(change.dataset.change==="modal"){state.qty=Math.min(50,Math.max(1,state.qty+delta));updatePanel()}else add(change.dataset.change,delta);return}
const addDetail=e.target.closest("[data-detail-add]");if(addDetail){let note=document.getElementById("item-note")?.value?.trim()||"";state.notes[state.productId]=note;const id=state.productId,qty=state.qty;add(id,qty);closePanel();toast(qty+(qty===1?" item adicionado":" itens adicionados"));return}
const checkout=e.target.closest("[data-checkout]");if(checkout){if(subtotal()<29.9)return;routeTo("checkout");return}
const mode=e.target.closest("[data-mode]");if(mode){state.fulfillment=mode.dataset.mode;render();return}
const pay=e.target.closest("[data-pay]");if(pay){state.pay=pay.dataset.pay;document.querySelectorAll("[data-pay]").forEach(b=>b.classList.toggle("active",b.dataset.pay===state.pay));return}
const advance=e.target.closest("[data-advance]");if(advance&&state.order){state.order.stage=Math.min(4,state.order.stage+1);save();render();toast("Etapa demonstrativa atualizada");return}
});
document.addEventListener("input",e=>{if(e.target.id==="search-input"){state.query=e.target.value;drawResults()}if(e.target.closest("#checkout-form")&&e.target.name)state.checkoutFields[e.target.name]=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="sort-input"){state.sort=e.target.value;drawResults()}});
document.addEventListener("submit",e=>{if(e.target.id==="location-form"){e.preventDefault();const fd=new FormData(e.target);const a=Object.fromEntries(["street","district","number","city"].map(k=>[k,String(fd.get(k)||"").trim()]));if(!a.street||!a.district||!a.number||!a.city)return;state.deliveryAddress=a;state.checkoutFields={...state.checkoutFields,street:a.street,district:a.district,number:a.number};closePanel();render();toast("Endereço preenchido na demonstração");return}if(e.target.id==="checkout-form"){e.preventDefault();processCheckout(e.target)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
window.addEventListener("popstate",()=>{const r=location.hash.slice(1);state.route=["home","menu","favorites","orders","checkout"].includes(r)?r:"home";closePanel();render()});
let pointerStartX=null,pointerTarget=null,suppressWheelClickUntil=0,suppressHeroClickUntil=0;
document.addEventListener("pointerdown",e=>{const wheel=e.target.closest("#flavor-wheel"),hero=e.target.closest("#hero-deck");if(wheel||hero){pointerStartX=e.clientX;pointerTarget=wheel?"arc":"hero";if(wheel&&e.pointerType==="touch")wheel.classList.add("dragging")}},{passive:true});
document.addEventListener("pointermove",e=>{if(pointerTarget!=="arc"||pointerStartX===null)return;const wheel=document.getElementById("flavor-wheel");if(!wheel)return;const delta=Math.max(-65,Math.min(65,e.clientX-pointerStartX));wheel.style.setProperty("--drag",delta+"px")},{passive:true});
document.addEventListener("pointerup",e=>{if(pointerStartX===null)return;const wheel=document.getElementById("flavor-wheel");if(wheel){wheel.classList.remove("dragging");wheel.style.setProperty("--drag","0px")}const diff=e.clientX-pointerStartX;if(Math.abs(diff)>42){if(pointerTarget==="arc"&&document.getElementById("flavor-wheel")){suppressWheelClickUntil=Date.now()+330;updateArc(arcActive+(diff<0?1:-1))}if(pointerTarget==="hero"&&document.getElementById("hero-deck")){suppressHeroClickUntil=Date.now()+330;showHero(heroActive+(diff<0?1:-1))}}pointerStartX=null;pointerTarget=null},{passive:true});
document.addEventListener("pointercancel",()=>{pointerStartX=null;pointerTarget=null;document.getElementById("flavor-wheel")?.classList.remove("dragging");document.getElementById("flavor-wheel")?.style.setProperty("--drag","0px")},{passive:true});
document.addEventListener("keydown",e=>{if(document.activeElement?.id==="flavor-wheel"){if(e.key==="ArrowRight"){updateArc(arcActive+1);e.preventDefault()}if(e.key==="ArrowLeft"){updateArc(arcActive-1);e.preventDefault()}}});
const header=document.querySelector(".header");header.insertAdjacentHTML("beforeend",'<div class="scroll-progress" id="scroll-progress"></div>');
let scrollTick=false;window.addEventListener("scroll",()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{const total=Math.max(1,document.documentElement.scrollHeight-innerHeight);document.getElementById("scroll-progress").style.width=Math.min(100,scrollY/total*100)+"%";scrollTick=false})},{passive:true});
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){heroAuto=setInterval(()=>{if(state.route==="home"&&!document.hidden&&!state.panel)showHero(heroActive+1)},6500)}

document.addEventListener("error",event=>{const img=event.target;if(img?.tagName==="IMG"&&img.dataset?.fallback){const fallback=img.dataset.fallback;img.removeAttribute("data-fallback");if(img.src!==fallback)img.src=fallback}},true);
const initial=location.hash.slice(1);if(["home","menu","favorites","orders","checkout"].includes(initial))state.route=initial;
render();
const loaderEl=document.getElementById("loader"),loadingCopy=loaderEl?.querySelector(".load-copy");
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const loaderStart=performance.now(),minimumIntro=reduceMotion?250:3050,maximumIntro=reduceMotion?900:4600;
let introClosing=false;
function finishIntro(){if(introClosing)return;introClosing=true;const remainder=Math.max(0,minimumIntro-(performance.now()-loaderStart));setTimeout(()=>loaderEl?.classList.add("out"),remainder)}
if(document.readyState==="complete")finishIntro();else window.addEventListener("load",finishIntro,{once:true});
setTimeout(()=>{if(loadingCopy&&!introClosing)loadingCopy.textContent="Escolhendo os ingredientes…"},950);
setTimeout(()=>{if(loadingCopy&&!loaderEl.classList.contains("out"))loadingCopy.textContent="Seu próximo favorito está chegando…"},2100);
setTimeout(()=>loaderEl?.classList.add("out"),maximumIntro);

</script></body></html>
